    <main class="content">
        <h1>Pagamento</h1>
        <div class="payment-box">
            <form>
                <label for="cardNumber">Número do Cartão</label>
                <input type="text" id="cardNumber" name="cardNumber" placeholder="1234 5678 9012 3456" maxlength="19"
                    required />

                <label for="cardHolder">Nome no Cartão</label>
                <input type="text" id="cardHolder" name="cardHolder" placeholder="Nome completo" required />

                <div class="payment-row">
                    <div>
                        <label for="expMonth">Mês</label>
                        <input type="text" id="expMonth" name="expMonth" placeholder="MM" maxlength="2" required />
                    </div>
                    <div>
                        <label for="expYear">Ano</label>
                        <input type="text" id="expYear" name="expYear" placeholder="AAAA" maxlength="4" required />
                    </div>
                    <div>
                        <label for="cvv">CVV</label>
                        <input type="password" id="cvv" name="cvv" placeholder="123" maxlength="4" required />
                    </div>
                </div>

                <label for="cardType">Tipo de Cartão</label>
                <select id="cardType" name="cardType" required>
                    <option value="">Selecione</option>
                    <option value="debito">Débito</option>
                    <option value="credito">Crédito</option>
                </select>

                <div class="payment-buttons">
                    <a href="../html/cadastro-profissional.html" class="confirm-button">Confirmar Pagamento</a>
                    <button href="../html/planos.html " class="cancel-button">Cancelar</button>
                </div>

        </div>
        </form>
        </div>
    </main>

    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
