<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro Profissional - Mundo Atípico</title>
  <link rel="stylesheet" href="../css/cadastro-profissional.css" />
</head>

<body>
  <div class="top-bar"></div>

  <div id="botao-voltar">
    <a href="../html/profissionais.html" class="btn-voltar">
      <img src="../img/botao-voltar.png" alt="Voltar" />
      Voltar
    </a>
  </div>

  <div class="cadastro-container">
    <h2>Cadastro do Profissional</h2>

    <form id="cadastroProfissionalForm" autocomplete="off">
      <fieldset>
        <legend>Profissional</legend>

        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" required />

        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf" pattern="\d{3}\.?\d{3}\.?\d{3}-?\d{2}" placeholder="000.000.000-00"
          required />

        <label for="nascimento">Data de nascimento</label>
        <input type="date" id="nascimento" name="nascimento" required />

        <label for="formacao">Área de formação</label>
        <select id="formacao" name="formacao" required>
          <option value="FISIOTERAPEUTA">Fisioterapeuta</option>
          <option value="NUTRICIONISTA">Nutricionista</option>
          <option value="ENFERMEIRO">Enfermeiro</option>
          <option value="PSICOPEDAGOGA">Psicopedagoga</option>
          <option value="FONOAUDIOLOGA">Fonoaudióloga</option>
          <option value="PSICOLOGO">Psicologo</option>
          <option value="NEUROLOGISTA">Neurologista</option>
        </select>

        <label for="especializacoes">Especialização</label>
        <select id="especializacoes" name="especializacoes" required>
          <option value="">Selecione</option>
          <option value="AUTISMO">Autismo</option>
          <option value="SINDROME_DE_DOWN">Síndrome de Down</option>
          <option value="SINDROME_DE_TOURETTE">Síndrome de Tourette</option>
          <option value="SINDROME_DE_TURNER">Síndrome de Turner</option>
          <option value="EPIDERMOLISE_BOLHOSA">Epidermólise Bolhosa</option>
          <option value="OSTEOGENESE_IMPERFEITA">Osteogênese Imperfeita</option>
          <option value="SINDROME_DE_RETT">Síndrome de Rett</option>
        </select>

        <label for="registro">Registro profissional</label>
        <input type="text" id="registro" name="registro" required />
      </fieldset>

      <fieldset>
        <legend>Contatos</legend>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required />

        <label for="telefone">Telefone ou celular</label>
        <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required />
      </fieldset>

      <fieldset>
        <legend>Endereço Profissional</legend>

        <label for="logradouro">Logradouro</label>
        <input type="text" id="logradouro" name="logradouro" required />

        <label for="numero">Número</label>
        <input type="text" id="numero" name="numero" required />

        <label for="complemento">Complemento</label>
        <input type="text" id="complemento" name="complemento" />

        <label for="bairro">Bairro</label>
        <input type="text" id="bairro" name="bairro" required />

        <label for="cidade">Cidade</label>
        <input type="text" id="cidade" name="cidade" required />

        <label for="uf">UF</label>
        <select id="uf" name="uf" required>
          <option value="">Selecione</option>
          <option value="AC">AC - Acre</option>
          <option value="AL">AL - Alagoas</option>
          <option value="AP">AP - Amapá</option>
          <option value="AM">AM - Amazonas</option>
          <option value="BA">BA - Bahia</option>
          <option value="CE">CE - Ceará</option>
          <option value="DF">DF - Distrito Federal</option>
          <option value="ES">ES - Espírito Santo</option>
          <option value="GO">GO - Goiás</option>
          <option value="MA">MA - Maranhão</option>
          <option value="MT">MT - Mato Grosso</option>
          <option value="MS">MS - Mato Grosso do Sul</option>
          <option value="MG">MG - Minas Gerais</option>
          <option value="PA">PA - Pará</option>
          <option value="PB">PB - Paraíba</option>
          <option value="PR">PR - Paraná</option>
          <option value="PE">PE - Pernambuco</option>
          <option value="PI">PI - Piauí</option>
          <option value="RJ">RJ - Rio de Janeiro</option>
          <option value="RN">RN - Rio Grande do Norte</option>
          <option value="RS">RS - Rio Grande do Sul</option>
          <option value="RO">RO - Rondônia</option>
          <option value="RR">RR - Roraima</option>
          <option value="SC">SC - Santa Catarina</option>
          <option value="SP">SP - São Paulo</option>
          <option value="SE">SE - Sergipe</option>
          <option value="TO">TO - Tocantins</option>
        </select>

        <label for="cep">CEP</label>
        <input type="text" id="cep" name="cep" pattern="\d{5}-?\d{3}" placeholder="00000-000" required />
      </fieldset>

      <fieldset>
        <legend>Informações Complementares</legend>

        <label for="diploma">Diploma ou certificado</label>
        <input type="file" id="diploma" name="diploma" accept=".pdf,.jpg,.png" required />

        <label for="experiencia">Tempo de experiência (anos)</label>
        <input type="number" id="experiencia" name="experiencia" min="0" required />

        <label for="publico_atipico">Tempo com público atípico (anos)</label>
        <input type="number" id="publico_atipico" name="publico_atipico" min="0" required />

        <label for="tipos_atendimento">Tipos de atendimento</label>
        <input type="text" id="tipos_atendimento" name="tipos_atendimento" required />

        <label for="foto">Foto profissional</label>
        <input type="file" id="foto" name="foto" accept="image/*" required />

        <label for="mini_bio">Mini bio</label>
        <textarea id="mini_bio" name="mini_bio" rows="4" required></textarea>

        <label for="redes_sociais">Redes sociais</label>
        <input type="text" id="redes_sociais" name="redes_sociais" />
      </fieldset>

      <button type="submit" class="cadastro-btn">Cadastrar</button>
    </form>
  </div>

  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
  </script>

  <footer class="footer">
    <div class="footer-content">
      <div class="footer-section">
        <div class="social-icons">
          <a href="#"><i class="fab fa-facebook-f"></i></a>
          <a href="#"><i class="fab fa-instagram"></i></a>
        </div>
      </div>
      <div class="footer-section">
        <h3>Contato</h3>
        <p>(35) 3445-3254</p>
        <p>(35) 99730-5412</p>
        <p>mundoatipico@atendimento.com.br</p>
      </div>
    </div>
  </footer>

  <script src="../java-script/cadastro-profissional.js"></script>
</body>

</html>
